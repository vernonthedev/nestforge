name: Vouch Check

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check author against base-branch trust list
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const want = author.trim().replace(/^@/, "").toLowerCase();
            const bare = (u) => u.split(":").pop();
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: author,
            });
            if (["admin", "maintain", "write"].includes(perm.permission)) {
              return;
            }
            let file;
            try {
              ({ data: file } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: ".github/VOUCHED.td",
                ref: pr.base.sha,
              }));
            } catch (error) {
              if (error.status === 404) {
                core.notice("No .github/VOUCHED.td on base branch; vouch check skipped (opt-in).");
                return;
              }
              throw error;
            }
            const lines = Buffer.from(file.content, "base64").toString("utf8").split("\n");
            let vouched = false;
            let denounced = false;
            for (const raw of lines) {
              const line = raw.trim();
              if (!line || line.startsWith("#")) continue;
              if (line.startsWith("-")) {
                const u = line.slice(1).split(/\s+/)[0].replace(/^@/, "").toLowerCase();
                if (u === want || bare(u) === bare(want)) denounced = true;
              } else {
                const u = line.split(/\s+/)[0].replace(/^@/, "").toLowerCase();
                if (u === want || bare(u) === bare(want)) vouched = true;
              }
            }

            const issue = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
            };
            if (denounced) {
              await github.rest.issues.createComment({
                ...issue,
                body: `@${author} this PR was closed automatically because the author is denounced in \`.github/VOUCHED.td\`. A maintainer can review or appeal.`,
              });
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                state: "closed",
              });
              return;
            }
            if (!vouched) {
              await github.rest.issues.addLabels({ ...issue, labels: ["needs-vouch"] });
              await github.rest.issues.createComment({
                ...issue,
                body: `@${author} thanks for the PR! A maintainer needs to vouch for first-time contributors before review can start. A maintainer can run \`/vouch @${author}\` in a comment.`,
              });
            }
