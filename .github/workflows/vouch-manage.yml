name: Vouch Manage

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: vouch-manage
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - name: Apply /vouch or /denounce from maintainer comment
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.comment.body || "").trim();
            const match = body.match(/^\/(vouch|denounce)\s+@?([\w-]+)(?:\s+(.*))?$/i);
            if (!match) return;
            const [, cmd, user, reason] = match;
            const commenter = context.payload.comment.user.login;
            const replyTo = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
            };
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: commenter,
            });
            if (!["admin", "maintain", "write"].includes(perm.permission)) {
              await github.rest.issues.createComment({
                ...replyTo,
                body: `@${commenter} only maintainers can use \`/${cmd}\`.`,
              });
              return;
            }

            const path = ".github/VOUCHED.td";
            let branch = context.payload.repository.default_branch;
            if (context.payload.issue.pull_request) {
              const { data: commentedPr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.issue.number,
              });
              branch = commentedPr.base.ref;
            }
            let sha = undefined;
            let contents = "";
            try {
              const { data: file } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: branch,
              });
              if (!Array.isArray(file)) {
                sha = file.sha;
                if (file.encoding === "none") {
                  const { data: blob } = await github.rest.git.getBlob({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    file_sha: file.sha,
                  });
                  contents = Buffer.from(blob.content, blob.encoding).toString("utf8");
                } else {
                  contents = Buffer.from(file.content, "base64").toString("utf8");
                }
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const norm = (u) => u.trim().replace(/^@/, "").toLowerCase();
            const want = norm(user);
            const known = contents.split("\n").some((raw) => {
              const line = raw.trim();
              if (!line || line.startsWith("#")) return false;
              const u = norm(line.startsWith("-") ? line.slice(1).split(/\s+/)[0] : line.split(/\s+/)[0]);
              return u === want || u.split(":").pop() === want.split(":").pop();
            });
            if (known) {
              await github.rest.issues.createComment({
                ...replyTo,
                body: `@${user} is already recorded in \`${path}\`; edit the file directly to change status.`,
              });
              return;
            }

            if (contents && !contents.endsWith("\n")) contents += "\n";
            contents += cmd.toLowerCase() === "denounce" ? `-${user}${reason ? ` ${reason}` : ""}\n` : `${user}\n`;
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch,
              sha,
              message: `${cmd.toLowerCase()} @${user} via comment by @${commenter}`,
              content: Buffer.from(contents).toString("base64"),
            });
            const openPrs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            for (const openPr of openPrs.filter((openPr) => openPr.user.login.toLowerCase() === want)) {
              const target = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: openPr.number,
              };
              if (cmd.toLowerCase() === "denounce") {
                await github.rest.issues.createComment({
                  ...target,
                  body: `@${user} this PR was closed automatically because the author is denounced in \`${path}\`. A maintainer can review or appeal.`,
                });
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: openPr.number,
                  state: "closed",
                });
              } else {
                try {
                  await github.rest.issues.removeLabel({ ...target, name: "needs-vouch" });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
            }
            await github.rest.issues.createComment({
              ...replyTo,
              body: `Recorded \`/${cmd} @${user}\` in \`${path}\`.`,
            });
