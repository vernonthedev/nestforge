name: Vouch Manage

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - name: Apply /vouch or /denounce from maintainer comment
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.comment.body || "").trim();
            const match = body.match(/^\/(vouch|denounce)\s+@?([\w-]+)(?:\s+(.*))?$/i);
            if (!match) return;
            const [, cmd, user, reason] = match;
            const commenter = context.payload.comment.user.login;
            const replyTo = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
            };
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: commenter,
            });
            if (!["admin", "maintain", "write"].includes(perm.permission)) {
              await github.rest.issues.createComment({
                ...replyTo,
                body: `@${commenter} only maintainers can use \`/${cmd}\`.`,
              });
              return;
            }

            const path = ".github/VOUCHED.td";
            const branch = context.payload.repository.default_branch;
            let sha = undefined;
            let contents = "";
            try {
              const { data: file } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: branch,
              });
              if (!Array.isArray(file)) {
                sha = file.sha;
                contents = Buffer.from(file.content, "base64").toString("utf8");
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const norm = (u) => u.trim().replace(/^@/, "").toLowerCase();
            const want = norm(user);
            const known = contents.split("\n").some((raw) => {
              const line = raw.trim();
              if (!line || line.startsWith("#")) return false;
              const u = norm(line.startsWith("-") ? line.slice(1).split(/\s+/)[0] : line.split(/\s+/)[0]);
              return u === want || u.split(":").pop() === want.split(":").pop();
            });
            if (known) {
              await github.rest.issues.createComment({
                ...replyTo,
                body: `@${user} is already recorded in \`${path}\`; edit the file directly to change status.`,
              });
              return;
            }

            if (contents && !contents.endsWith("\n")) contents += "\n";
            contents += cmd.toLowerCase() === "denounce" ? `-${user}${reason ? ` ${reason}` : ""}\n` : `${user}\n`;
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch,
              sha,
              message: `${cmd.toLowerCase()} @${user} via comment by @${commenter}`,
              content: Buffer.from(contents).toString("base64"),
            });
            await github.rest.issues.createComment({
              ...replyTo,
              body: `Recorded \`/${cmd} @${user}\` in \`${path}\`.`,
            });
